name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Python Version
        run: python --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fast-api-etl:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/fast-api-etl:${{ env.IMAGE_TAG }}

      - name: Clone Helm Repository
        run: |
          git clone https://${{ secrets.HELM_REPO_USERNAME }}:${{ secrets.HELM_REPO_TOKEN }}@github.com/DarshanChr/fast-api-helm.git
          cd fast-api-helm
          git checkout develop

      - name: Update Helm values.yaml
        run: |
          cd fast-api-helm
          sed -i "s/tag:.*/tag: ${IMAGE_TAG}/" values.yaml

      - name: Commit and Push Helm Changes
        run: |
          cd fast-api-helm

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add values.yaml
          git commit -m "Update image tag to ${IMAGE_TAG}" || echo "No changes"

          git push origin develop

      - name: Verify Application
        run: |
          echo "CI Pipeline executed successfully"